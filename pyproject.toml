[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flsim"
version = "0.1.0"
description = "A modular federated learning simulator with wireless channel, time and energy modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flsim*"]

[tool.setuptools.package-data]
flsim = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["flsim/tests"]
